AWSTemplateFormatVersion: '2010-09-09'
Description: "Bootstrap CI/CD: GitHub OIDC -> Pipeline Roles -> CloudFormation Service Roles (dev/prod)"

Parameters:
  GitHubOrg:
    Type: String
    Description: "GitHub org/user (e.g. ivo-bubenko)"
  GitHubRepo:
    Type: String
    Description: "GitHub repo name (e.g. portfolio)"
  DevBranch:
    Type: String
    Default: dev
  ProdBranch:
    Type: String
    Default: main
  Region:
    Type: String
    Default: eu-central-1

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
  CfnServiceRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "portfolio-cfn-exec-dev-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: portfolio-dev-infra
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Sid: CloudFrontManage
              Effect: Allow
              Action:
                - cloudfront:CreateDistribution
                - cloudfront:UpdateDistribution
                - cloudfront:GetDistribution
                - cloudfront:GetDistributionConfig
                - cloudfront:DeleteDistribution
                - cloudfront:CreateOriginAccessControl
                - cloudfront:GetOriginAccessControl
                - cloudfront:UpdateOriginAccessControl
                - cloudfront:DeleteOriginAccessControl
                - cloudfront:CreateInvalidation
                - cloudfront:TagResource
                - cloudfront:UntagResource
              Resource: "*"
            - Sid: S3Manage
              Effect: Allow
              Action:
                - s3:CreateBucket
                - s3:DeleteBucket
                - s3:PutBucketPolicy
                - s3:DeleteBucketPolicy
                - s3:PutBucketPublicAccessBlock
                - s3:PutBucketOwnershipControls
                - s3:PutBucketVersioning
                - s3:GetBucketLocation
              Resource: "*"

  CfnServiceRoleProd:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "portfolio-cfn-exec-prod-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: portfolio-prod-infra
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFrontManage
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:CreateInvalidation
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                Resource: "*"

              - Sid: S3Manage
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketVersioning
                  - s3:GetBucketLocation
                Resource: "*"

  GitHubPipelineRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "portfolio-gha-dev-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: "sts.amazonaws.com"
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${DevBranch}"
      Policies:
        - PolicyName: gha-dev-cfn-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Pipeline potrebuje iba ovládať CFN (ideálne cez changeset).
              - Sid: CloudFormationDeployDev
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub "arn:aws:cloudformation:${Region}:${AWS::AccountId}:stack/portfolio-dev/*"
              - Sid: PassCfnServiceRoleDev
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnServiceRoleDev.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  GitHubPipelineRoleProd:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "portfolio-gha-prod-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: "sts.amazonaws.com"
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${ProdBranch}"
      Policies:
        - PolicyName: gha-prod-cfn-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationDeployProd
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub "arn:aws:cloudformation:${Region}:${AWS::AccountId}:stack/portfolio-prod/*"

              - Sid: PassCfnServiceRoleProd
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnServiceRoleProd.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

Outputs:
  DevPipelineRoleArn:
    Value: !GetAtt GitHubPipelineRoleDev.Arn
  ProdPipelineRoleArn:
    Value: !GetAtt GitHubPipelineRoleProd.Arn
  DevCfnServiceRoleArn:
    Value: !GetAtt CfnServiceRoleDev.Arn
  ProdCfnServiceRoleArn:
    Value: !GetAtt CfnServiceRoleProd.Arn
