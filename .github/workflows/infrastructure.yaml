name: Deploy infrastructure
on: workflow_call

env:
  AWS_REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy_infra:
    name: Deploy infrastructure (CloudFormation)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC) - INFRA role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CFN stack
        run: |
          aws cloudformation deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --template-file cloud_infrastructure/portfolio-cfn.yaml \
            --role-arn "${{ vars.CFN_ROLE }}" \
            --parameter-overrides \
              DomainName="${{ vars.DOMAIN_NAME }}" \
              CertificateArn="${{ secrets.ACM_ARN }}" \
            --no-fail-on-empty-changeset
