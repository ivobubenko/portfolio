name: Deploy CFN
on:
  push:
    branches: [ "dev", "main" ]
env:
  AWS_REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            infra:
              - 'cloud_infrastructure/**'
            app:
              - '**'
              - '!cloud_infrastructure/**'

  deploy_infra:
    name: Deploy infrastructure (CloudFormation)
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: infra-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC) - INFRA role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CFN stack
        run: |
          aws cloudformation deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --template-file cloud_infrastructure/portfolio-cfn.yaml \
            --role-arn "${{ vars.CFN_ROLE }}" \
            --parameter-overrides \
              DomainName="${{ vars.DOMAIN_NAME }}" \
              CertificateArn="${{ env.ACM_ARN }}" \
            --no-fail-on-empty-changeset

  deploy_app:
    name: Deploy site (S3) + invalidate CloudFront
    needs: changes

    if: ${{ needs.changes.outputs.infra != 'true' && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: app-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC) - S3 and CF role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.S3CF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CFN outputs
        id: cfn
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail

          SITE_BUCKET="$(aws cloudformation describe-stacks \
            --no-paginate \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" \
            --output text)"

          CF_DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
            --no-paginate \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" \
            --output text)"

          echo "SITE_BUCKET=$SITE_BUCKET" >> "$GITHUB_ENV"
          echo "CF_DISTRIBUTION_ID=$CF_DISTRIBUTION_ID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Upload to S3
        run: |
          aws s3 sync ./dist "s3://${SITE_BUCKET}/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/*"
