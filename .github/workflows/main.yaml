name: Deploy portfolio
on:
  push:
    branches: [ "dev", "main" ]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            infra:
              - 'cloud_infrastructure/**'
            app:
              - '**'
              - '!cloud_infrastructure/**'

  deploy_infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    uses: ./.github/workflows/infrastructure.yaml
    secrets: inherit

  deploy_app:
    needs: [changes, deploy_infra]
    if: >-
      ${{
        !cancelled() &&
        needs.changes.result == 'success' &&
        (needs.changes.outputs.app == 'true' || needs.changes.outputs.infra == 'true') &&
        (needs.deploy_infra.result == 'success' || needs.deploy_infra.result == 'skipped')
      }}
    uses: ./.github/workflows/website.yaml
    secrets: inherit
