name: Deploy website
on: workflow_call
env:
  AWS_REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy_app:
    name: Deploy site (S3) + invalidate CloudFront
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC) - S3 and CF role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.S3CF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CFN outputs
        id: cfn
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail

          SITE_BUCKET="$(aws cloudformation describe-stacks \
            --no-paginate \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" \
            --output text)"

          CF_DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
            --no-paginate \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" \
            --output text)"

          echo "SITE_BUCKET=$SITE_BUCKET" >> "$GITHUB_ENV"
          echo "CF_DISTRIBUTION_ID=$CF_DISTRIBUTION_ID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Upload to S3
        run: |
          aws s3 sync ./dist "s3://${SITE_BUCKET}/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/*"
