
name: Code Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Lint and Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: ESLint
        run: npm run lint

      - name: Validate Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --no-install commitlint \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose
